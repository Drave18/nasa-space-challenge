[package]
name = "nssdca-scraper"
version = "0.1.0"
edition = "2024"
description = "Moon/Mars surface-mission metadata scraper for the NASA NSSDCA archive"

[lib]
name = "nssdca_scraper"
path = "src/lib.rs"

[[bin]]
name = "nssdca-scraper"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
fastrand = "2"
futures-util = "0.3"
httpdate = "1"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "gzip", "charset", "stream"] }
select = "0.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util", "net", "io-util"] }
wiremock = "0.6"
